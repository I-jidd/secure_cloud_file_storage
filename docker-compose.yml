services:
  postgres:
    image: postgres:16
    container_name: secure_cloud_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: secure_cloud_storage
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    container_name: secure_cloud_backend
    restart: unless-stopped
    environment:
      APP_NAME: Secure Cloud Storage API
      APP_ENV: development
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/secure_cloud_storage
      JWT_SECRET_KEY: change-this-secret-key
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      STORAGE_BACKEND: local
      LOCAL_STORAGE_PATH: storage/uploads
      MAX_FILE_SIZE_MB: 10
      ALLOWED_FILE_TYPES: application/pdf,image/png,image/jpeg,text/plain,application/vnd.openxmlformats-officedocument.wordprocessingml.document
    ports:
      - "8000:8000"
    volumes:
      - backend_uploads:/app/storage/uploads
    depends_on:
      - postgres

  frontend:
    build:
      context: ./frontend
    container_name: secure_cloud_frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  backend_uploads:
